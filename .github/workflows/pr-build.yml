      #   run: ${{ matrix.install_packager }}
      #   shell: pwsh

      - name: Run hunk-terminal tests
        if: runner.os == 'macOS'
        run: nix develop --accept-flake-config -c cargo test -p hunk-terminal --tests
        shell: bash

      - name: Run hunk-terminal tests
        if: runner.os == 'Windows'
        run: cargo test -p hunk-terminal --tests
        shell: pwsh

      - name: Build hunk-qt
        if: runner.os == 'macOS'
        run: nix develop --accept-flake-config -c cargo build -p hunk-qt --locked --profile ci
        shell: bash

      - name: Build hunk-qt
        if: runner.os == 'Windows'
        run: cargo build -p hunk-qt --locked --profile ci
        shell: pwsh

      - name: Run Qt QML smoke tests
        run: bash ./scripts/qt/test_qml.sh
