name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/workflows/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "crates/**"
      - "scripts/**"
      - "tools/**"
      - "assets/browser-runtime/**"
      - "assets/icons/**"
      - "docs/QT_MIGRATION_ROADMAP.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  HUNK_QT_VERSION: "6.11.2"

jobs:
  linux:
    name: Linux Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.HUNK_QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: hunk-qt-${{ env.HUNK_QT_VERSION }}-linux
          aqtversion: ==3.3.0

      - name: Cache cargo registry and Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-build-${{ runner.os }}-qt-v1
          workspaces: |
            . -> target
          cache-on-failure: "true"
          cmd-format: nix develop --accept-flake-config -c {0}

      # Temporarily disabled for PR builds; release packaging stays in release workflows.
      # - name: Resolve release version
      #   run: |
      #     version="$(./scripts/resolve_hunk_version.sh)"
      #     echo "HUNK_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      #   shell: bash

      - name: Check formatting
        run: nix develop --accept-flake-config -c cargo fmt --all --check
        shell: bash

      - name: Run clippy
        run: nix develop --accept-flake-config -c cargo clippy --workspace --exclude hunk-desktop --all-targets -- -D warnings
        shell: bash

      - name: Run tests
        run: |
          nix develop --accept-flake-config -c bash -c '
            unset CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER
            export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$HUNK_LINUX_PACKAGING_LIBRARY_PATH"
            cargo test --workspace --exclude hunk-desktop
          '
        shell: bash

      - name: Run Qt QML smoke tests
        run: nix develop --accept-flake-config -c ./scripts/qt/test_qml.sh
        shell: bash

      # Temporarily disabled for PR builds; release packaging stays in release workflows.
      # - name: Package Linux artifacts
      #   run: ./scripts/package_linux_release_zed_like.sh --formats tarball,deb,rpm
      #   shell: bash
      #
      # - name: Upload Linux tarball artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: hunk-linux-x86_64-tarball
      #     path: target/dist/Hunk-${{ env.HUNK_RELEASE_VERSION }}-linux-x86_64.tar.gz
      #     if-no-files-found: error
      #
      # - name: Upload Linux Debian artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: hunk-linux-x86_64-deb
      #     path: target/dist/hunk-desktop_${{ env.HUNK_RELEASE_VERSION }}-1_amd64.deb
      #     if-no-files-found: error
      #
      # - name: Upload Linux RPM artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: hunk-linux-x86_64-rpm
      #     path: target/dist/*.rpm
      #     if-no-files-found: error

  build:
    name: Windows Build
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          use-cache: false
          version: 0.15.2

      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.HUNK_QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: hunk-qt-${{ env.HUNK_QT_VERSION }}-windows-aqt-8c3695d4
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

