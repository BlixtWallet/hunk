name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - ".github/workflows/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "crates/**"
      - "scripts/**"
      - "tools/**"
      - "assets/browser-runtime/**"
      - "assets/icons/**"
      - "docs/QT_MIGRATION_ROADMAP.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  HUNK_QT_VERSION: "6.11.2"

jobs:
  linux:
    name: Linux Checks
    runs-on: ubuntu-self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.HUNK_QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          cache-key-prefix: hunk-qt-${{ env.HUNK_QT_VERSION }}-linux
          aqtversion: ==3.3.0

      # - name: Cache cargo registry and Rust dependencies
      #   uses: Swatinem/rust-cache@v2
      #   with:
      #     shared-key: pr-build-${{ runner.os }}-desktop-v2
      #     workspaces: |
      #       . -> target
      #     cache-on-failure: "true"
      #     cmd-format: nix develop --accept-flake-config -c {0}

      # Temporarily disabled for PR builds; release packaging stays in release workflows.
      # - name: Resolve release version
      #   run: |
      #     version="$(./scripts/resolve_hunk_version.sh)"
      #     echo "HUNK_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      #   shell: bash

      - name: Check formatting
        run: nix develop --accept-flake-config -c cargo fmt --all --check
        shell: bash

      - name: Run clippy
        run: nix develop --accept-flake-config -c cargo clippy --workspace --exclude hunk-desktop --all-targets -- -D warnings
        shell: bash

      - name: Run tests
        run: nix develop --accept-flake-config -c cargo test --workspace --exclude hunk-desktop
        shell: bash

      - name: Run Qt QML smoke tests
        run: nix develop --accept-flake-config -c ./scripts/qt/test_qml.sh
        shell: bash

      # Temporarily disabled for PR builds; release packaging stays in release workflows.
      # - name: Package Linux artifacts
      #   run: ./scripts/package_linux_release_zed_like.sh --formats tarball,deb,rpm
      #   shell: bash
      #
      # - name: Upload Linux tarball artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: hunk-linux-x86_64-tarball
      #     path: target/dist/Hunk-${{ env.HUNK_RELEASE_VERSION }}-linux-x86_64.tar.gz
      #     if-no-files-found: error
      #
      # - name: Upload Linux Debian artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: hunk-linux-x86_64-deb
      #     path: target/dist/hunk-desktop_${{ env.HUNK_RELEASE_VERSION }}-1_amd64.deb
      #     if-no-files-found: error
      #
      # - name: Upload Linux RPM artifact
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: hunk-linux-x86_64-rpm
      #     path: target/dist/*.rpm
      #     if-no-files-found: error

  build:
    name: ${{ matrix.name }} Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macOS
            install_packager: cargo install cargo-packager --locked --version 0.11.8
            resolve_version: |
              version="$(./scripts/resolve_hunk_version.sh)"
              echo "HUNK_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          - name: Windows
            os: blacksmith-4vcpu-windows-2025
            install_packager: cargo install cargo-packager --locked --version 0.11.8
            resolve_version: |
              $version = (bash ./scripts/resolve_hunk_version.sh).Trim()
              "HUNK_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Disable stale local Nix cache configuration
        if: runner.os == 'macOS'
        run: |
          {
            echo "NIX_CONFIG<<EOF"
            echo "post-build-hook ="
            echo "extra-substituters ="
            echo "substituters = https://cache.nixos.org/"
            echo "EOF"
          } >> "$GITHUB_ENV"
        shell: bash

      - name: Install stable Rust
        if: runner.os != 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          use-cache: false
          version: 0.15.2

      - name: Expose pinned external Qt
        if: runner.os == 'macOS'
        env:
          HUNK_QT_CACHE_ROOT: /Volumes/hulk/dev/cache/qt
          HUNK_QT_TMPDIR: /Volumes/hulk/dev/cache/hunk-tmp
        run: |
          ./scripts/qt/install_qt.sh
          source ./scripts/qt/qt_env.sh
          echo "HUNK_BUILD_TMPDIR=/Volumes/hulk/dev/cache/hunk-tmp" >> "$GITHUB_ENV"
          echo "HUNK_QT_ROOT=$HUNK_QT_ROOT" >> "$GITHUB_ENV"
          echo "QT_ROOT_DIR=$HUNK_QT_ROOT" >> "$GITHUB_ENV"
          echo "QMAKE=$HUNK_QT_ROOT/bin/qmake" >> "$GITHUB_ENV"
          echo "$HUNK_QT_ROOT/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Cache pinned Qt
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\hunk-qt
          key: hunk-qt-${{ env.HUNK_QT_VERSION }}-windows-msvc2022-x64-v1

      - name: Install pinned Qt
        if: runner.os == 'Windows'
        run: ./scripts/qt/install_qt_windows.ps1 -InstallRoot "${{ runner.temp }}\hunk-qt"
        shell: pwsh

      # - name: Cache cargo registry and Rust dependencies
      #   if: runner.os == 'macOS'
      #   uses: Swatinem/rust-cache@v2
      #   with:
      #     shared-key: pr-build-${{ runner.os }}-desktop-v2
      #     workspaces: |
      #       . -> target
      #     cache-on-failure: "true"
      #     cmd-format: nix develop --accept-flake-config -c {0}

      - name: Cache cargo registry and Rust dependencies
        if: runner.os != 'macOS'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-build-${{ runner.os }}-desktop-v2
          workspaces: |
            . -> target
          cache-on-failure: "true"

      # Temporarily disabled for PR builds; release packaging stays in release workflows.
