[package]
name = "hunk-qt"
version = "0.0.11"
license.workspace = true
rust-version.workspace = true
edition = "2024"
authors = ["Nitesh Balusu"]
build = "build.rs"

[features]
default = []
cef-browser = ["hunk-browser/cef", "dep:hunk-browser-helper", "hunk-browser-helper/cef-subprocess"]

[[bin]]
name = "hunk_qt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
hunk-app = { path = "../hunk-app", default-features = false, features = ["ai", "comment-store"] }
hunk-browser = { path = "../hunk-browser" }
hunk-browser-helper = { path = "../hunk-browser-helper", optional = true }
hunk-codex = { path = "../hunk-codex" }
hunk-domain = { path = "../hunk-domain", default-features = false, features = ["database"] }
hunk-forge = { path = "../hunk-forge" }
hunk-git = { path = "../hunk-git" }
hunk-terminal = { path = "../hunk-terminal" }
qtbridge.workspace = true
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[build-dependencies]
cc = "1.2"
qtbridge-build-utils.workspace = true

[dev-dependencies]
tempfile = "3.23"
