[package]
name = "hunk-app"
version = "0.0.11"
license.workspace = true
edition = "2024"
authors = ["Nitesh Balusu"]

[features]
default = ["ai", "diff", "git"]
ai = [
  "dep:anyhow",
  "dep:base64",
  "dep:dirs",
  "dep:hunk-browser",
  "dep:hunk-codex",
  "dep:hunk-domain",
  "dep:hunk-mobile",
  "dep:image",
  "dep:serde_json",
  "dep:tracing",
  "dep:webbrowser",
]
diff = ["dep:anyhow", "dep:hunk-domain", "dep:hunk-git", "dep:hunk-language"]
comments = ["diff"]
git = ["dep:anyhow", "dep:hunk-domain", "dep:hunk-git", "dep:tracing"]

[dependencies]
anyhow = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }
dirs = { version = "6.0", optional = true }
hunk-browser = { path = "../hunk-browser", optional = true }
hunk-codex = { path = "../hunk-codex", optional = true }
hunk-domain = { path = "../hunk-domain", default-features = false, optional = true }
hunk-git = { path = "../hunk-git", optional = true }
hunk-language = { path = "../hunk-language", optional = true }
hunk-mobile = { path = "../hunk-mobile", optional = true }
image = { version = "0.25", optional = true }
serde_json = { version = "1.0", optional = true }
tracing = { version = "0.1", optional = true }
webbrowser = { version = "1.2.1", optional = true }

[dev-dependencies]
git2 = "0.20"
tempfile = "3.27.0"
