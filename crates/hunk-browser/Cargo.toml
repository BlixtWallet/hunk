[package]
name = "hunk-browser"
version = "0.1.0"
license.workspace = true
rust-version.workspace = true
edition = "2024"

[features]
default = []
cef = ["dep:cef"]

[dependencies]
cef = { git = "https://github.com/tauri-apps/cef-rs.git", rev = "a2e15ae659c4b3957883e34de879bd8b38360ce5", default-features = false, features = ["sandbox"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
